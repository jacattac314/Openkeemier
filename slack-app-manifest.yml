display_information:
  name: OpenKeemier
  description: Autonomous AI agent for managing projects — powered by the OpenClaw architecture
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: OpenKeemier
    always_online: true
  slash_commands:
    - command: /status
      description: Show OpenKeemier runtime health (uptime, heartbeat, memory)
      usage_hint: ""
      should_escape: false
    - command: /dev
      description: Dispatch a task to the autonomous dev team (Coder → Reviewer → Tester)
      usage_hint: "[task description]"
      should_escape: false
    - command: /clear
      description: Clear your conversation history with the agent
      usage_hint: ""
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - im:history
      - im:read
      - im:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
